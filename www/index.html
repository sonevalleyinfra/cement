<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sonevalley</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #faf6f1;
        color: #171717;
        padding: 24px;
        text-align: center;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #1d4ed8;
        color: #fff;
        font-size: 40px;
        font-weight: 900;
        display: grid;
        place-items: center;
      }
      a {
        padding: 12px 24px;
        border-radius: 12px;
        background: #1d4ed8;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="badge">S</div>
    <h2>Sonevalley</h2>
    <p>Please check your internet connection and tap Retry.</p>
    <a href="https://cement.buildcity.cloud/">Retry</a>
  </body>
</html>
