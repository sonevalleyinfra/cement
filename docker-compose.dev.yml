# Local Postgres for development only (not used on Coolify).
#   Start: docker compose -f docker-compose.dev.yml up -d
#   Stop:  docker compose -f docker-compose.dev.yml down
#   Wipe all local data: docker compose -f docker-compose.dev.yml down -v
#
# Port LOCAL_DB_PORT from .env (default 5433, not 5432) so it does not clash
# with a Postgres you may already have installed, or with your other projects.
# `pnpm dev` starts this automatically.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
